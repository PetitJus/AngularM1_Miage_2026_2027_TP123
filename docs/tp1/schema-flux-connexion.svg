<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1180" width="1000" height="1180" font-family="Segoe UI, Inter, system-ui, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#17312a"/>
    </marker>
    <marker id="arrowBack" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1d755e"/>
    </marker>
    <style>
      .title { font-size: 26px; font-weight: 700; fill: #123d32; }
      .sub { font-size: 14px; fill: #61756f; }
      .lane { font-size: 13px; font-weight: 700; fill: #ffffff; letter-spacing: 0.08em; }
      .box { fill: #ffffff; stroke: #1d755e; stroke-width: 1.5; }
      .boxTitle { font-size: 15px; font-weight: 700; fill: #123d32; }
      .file { font-size: 12px; fill: #1d755e; font-family: Consolas, monospace; }
      .txt { font-size: 13px; fill: #17312a; }
      .step { fill: #123d32; }
      .stepNum { font-size: 14px; font-weight: 700; fill: #ffffff; }
      .note { font-size: 12.5px; fill: #17312a; }
      .noteBox { fill: #fff8e1; stroke: #e0b84c; stroke-width: 1; }
      .back { font-size: 12.5px; fill: #1d755e; font-weight: 600; }
    </style>
  </defs>

  <rect width="1000" height="1180" fill="#f3f7f5"/>

  <text x="40" y="50" class="title">Flux « Se connecter » — Guitar Practice Cloud</text>
  <text x="40" y="74" class="sub">composant Angular → service Angular → HttpClient (+ intercepteur) → proxy → API Express → MongoDB, puis retour</text>

  <!-- Lanes -->
  <rect x="40" y="95" width="600" height="28" rx="6" fill="#276c57"/>
  <text x="56" y="114" class="lane">NAVIGATEUR — ANGULAR (localhost:4200)</text>
  <rect x="660" y="95" width="300" height="28" rx="6" fill="#123d32"/>
  <text x="676" y="114" class="lane">SERVEUR (localhost:3000)</text>

  <!-- 1. Template -->
  <circle cx="58" cy="165" r="15" class="step"/><text x="58" y="170" text-anchor="middle" class="stepNum">1</text>
  <rect x="85" y="140" width="520" height="80" rx="10" class="box"/>
  <text x="100" y="163" class="boxTitle">Formulaire réactif — clic sur « Se connecter »</text>
  <text x="100" y="182" class="file">components/login-page/login-page.html</text>
  <text x="100" y="202" class="txt">(ngSubmit)="submit()" · validations required / email affichées sous les champs</text>

  <!-- 2. Component -->
  <circle cx="58" cy="265" r="15" class="step"/><text x="58" y="270" text-anchor="middle" class="stepNum">2</text>
  <rect x="85" y="240" width="520" height="90" rx="10" class="box"/>
  <text x="100" y="263" class="boxTitle">LoginPageComponent.submit()</text>
  <text x="100" y="282" class="file">components/login-page/login-page.ts</text>
  <text x="100" y="302" class="txt">form invalide → markAllAsTouched() et arrêt ; sinon</text>
  <text x="100" y="320" class="txt">auth.login(email, password).subscribe({ next, error }) — pas de HttpClient ici</text>

  <!-- 3. Service -->
  <circle cx="58" cy="375" r="15" class="step"/><text x="58" y="380" text-anchor="middle" class="stepNum">3</text>
  <rect x="85" y="350" width="520" height="80" rx="10" class="box"/>
  <text x="100" y="373" class="boxTitle">AuthService.login()  (injecté avec inject())</text>
  <text x="100" y="392" class="file">shared/services/auth.service.ts</text>
  <text x="100" y="412" class="txt">http.post&lt;AuthResponse&gt;('/api/auth/login', { email, password })</text>

  <!-- 4. Interceptor -->
  <circle cx="58" cy="475" r="15" class="step"/><text x="58" y="480" text-anchor="middle" class="stepNum">4</text>
  <rect x="85" y="450" width="520" height="80" rx="10" class="box"/>
  <text x="100" y="473" class="boxTitle">authInterceptor (enregistré dans main.ts)</text>
  <text x="100" y="492" class="file">shared/interceptors/auth.interceptor.ts</text>
  <text x="100" y="512" class="txt">/api/auth/* → pas d'Authorization (publique) ; autres routes → Bearer</text>

  <!-- 5. Proxy -->
  <circle cx="58" cy="575" r="15" class="step"/><text x="58" y="580" text-anchor="middle" class="stepNum">5</text>
  <rect x="85" y="550" width="520" height="62" rx="10" class="box"/>
  <text x="100" y="573" class="boxTitle">Proxy du serveur de dev Angular</text>
  <text x="100" y="594" class="file">proxy.conf.json : /api → http://localhost:3000</text>

  <!-- Arrow to server -->
  <line x1="605" y1="581" x2="672" y2="581" stroke="#17312a" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="610" y="570" class="note">POST</text>

  <!-- 6. Express -->
  <circle cx="690" cy="535" r="15" class="step"/><text x="690" y="540" text-anchor="middle" class="stepNum">6</text>
  <rect x="675" y="550" width="285" height="150" rx="10" class="box"/>
  <text x="690" y="573" class="boxTitle">Route Express</text>
  <text x="690" y="592" class="file">backend/src/app.js</text>
  <text x="690" y="612" class="txt">app.post("/api/auth/login")</text>
  <text x="690" y="632" class="txt">email → minuscules</text>
  <text x="690" y="652" class="txt">User.findOne({ email })</text>
  <text x="690" y="672" class="txt">  .select("+passwordHash")</text>
  <text x="690" y="690" class="txt">verifyPassword() (bcrypt)</text>

  <!-- 7. MongoDB -->
  <circle cx="690" cy="735" r="15" class="step"/><text x="690" y="740" text-anchor="middle" class="stepNum">7</text>
  <rect x="675" y="750" width="285" height="80" rx="10" class="box"/>
  <text x="690" y="773" class="boxTitle">MongoDB Atlas</text>
  <text x="690" y="792" class="file">backend/src/models/User.js</text>
  <text x="690" y="812" class="txt">collection users (hash bcrypt)</text>
  <line x1="817" y1="700" x2="817" y2="748" stroke="#17312a" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 8. Response -->
  <circle cx="690" cy="865" r="15" class="step"/><text x="690" y="870" text-anchor="middle" class="stepNum">8</text>
  <rect x="675" y="880" width="285" height="110" rx="10" class="box"/>
  <text x="690" y="903" class="boxTitle">Réponse HTTP</text>
  <text x="690" y="925" class="txt">200 { token, user }</text>
  <text x="690" y="945" class="txt">  token = jwt.sign({ sub, email }, 2h)</text>
  <text x="690" y="967" class="txt">401 { message:</text>
  <text x="690" y="983" class="txt">  "Identifiants incorrects" }</text>

  <!-- Return arrow -->
  <path d="M675,935 L637,935 L637,700" stroke="#1d755e" stroke-width="2" fill="none"/>
  <line x1="637" y1="700" x2="609" y2="700" stroke="#1d755e" stroke-width="2" marker-end="url(#arrowBack)"/>
  <line x1="637" y1="920" x2="609" y2="920" stroke="#a33" stroke-width="2" marker-end="url(#arrowBack)"/>
  <text x="641" y="694" class="back">200</text>
  <text x="641" y="914" class="back" style="fill:#a33">401</text>

  <!-- 9. tap / store -->
  <circle cx="58" cy="665" r="15" class="step"/><text x="58" y="670" text-anchor="middle" class="stepNum">9</text>
  <rect x="85" y="640" width="520" height="118" rx="10" class="box" style="stroke:#1d755e; stroke-width:2.5"/>
  <text x="100" y="663" class="boxTitle">200 → tap(storeAuthentication) dans AuthService</text>
  <text x="100" y="684" class="txt">localStorage.setItem('gpc_token', token)   → survit au rechargement</text>
  <text x="100" y="704" class="txt">token.set(token)                            → Signal lu par guard/intercepteur</text>
  <text x="100" y="724" class="txt">currentUser.set(user)                       → Signal : l'en-tête affiche le nom</text>
  <text x="100" y="746" class="back">Le JWT n'est jamais écrit dans la console.</text>

  <!-- 10. Redirect -->
  <circle cx="58" cy="805" r="15" class="step"/><text x="58" y="810" text-anchor="middle" class="stepNum">10</text>
  <rect x="85" y="780" width="520" height="80" rx="10" class="box"/>
  <text x="100" y="803" class="boxTitle">next : router.navigateByUrl(returnUrl ?? '/tracks')</text>
  <text x="100" y="823" class="txt">authGuard laisse passer (token présent) ; les requêtes suivantes</text>
  <text x="100" y="842" class="txt">reçoivent « Authorization: Bearer … » via l'intercepteur</text>

  <!-- 11. Error -->
  <circle cx="58" cy="905" r="15" class="step" style="fill:#a33"/><text x="58" y="910" text-anchor="middle" class="stepNum">11</text>
  <rect x="85" y="880" width="520" height="80" rx="10" class="box" style="stroke:#a33"/>
  <text x="100" y="903" class="boxTitle" style="fill:#a33">401 → error : message affiché sous le formulaire</text>
  <text x="100" y="923" class="txt">apiErrorMessage() (shared/utils/api-error.ts) → « Identifiants incorrects »</text>
  <text x="100" y="943" class="txt">console : seulement le statut, jamais le mot de passe</text>

  <!-- Notes -->
  <rect x="40" y="1000" width="920" height="150" rx="10" class="noteBox"/>
  <text x="58" y="1025" class="boxTitle">À retenir</text>
  <text x="58" y="1049" class="note">• Routes publiques : GET /api/health, POST /api/auth/register, POST /api/auth/login. Toutes les autres exigent le JWT (middleware auth dans app.js).</text>
  <text x="58" y="1071" class="note">• Sur une route protégée, un 401 (token invalide ou expiré) est intercepté par authInterceptor → AuthService.handleUnauthorized()</text>
  <text x="58" y="1091" class="note">   → logout() (localStorage + Signals vidés) → redirection /login?expired=1.</text>
  <text x="58" y="1113" class="note">• Angular ne parle jamais à MongoDB : seul le backend connaît l'URI Atlas et le secret JWT (backend/.env).</text>
  <text x="58" y="1135" class="note">• Déconnexion : bouton de l'en-tête (components/app) → AuthService.logout() → /login.</text>
</svg>
